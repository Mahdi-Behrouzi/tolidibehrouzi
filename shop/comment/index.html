<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظرات مشتریان | تولیدی بهروزی</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <!-- HERO -->
  <div class="c-hero">
    <span class="c-hero-tag">نظر مشتریان</span>
    <h1 class="c-hero-title">تجربه خریدت رو با ما در میان بذار</h1>
    <p class="c-hero-desc">بعد از ثبت، نظر برای بررسی ارسال می‌شود — نظر مشتریان پایین فرم نمایش داده شده است</p>
    <div class="c-hero-stats">
      <div class="c-stat"><strong id="totalCount">—</strong><span>نظر ثبت‌شده</span></div>
      <div class="c-stat-sep"></div>
      <div class="c-stat"><strong id="avgRating">—</strong><span>میانگین امتیاز</span></div>
      <div class="c-stat-sep"></div>
      <div class="c-stat"><strong>۹۸٪</strong><span>رضایت مشتریان</span></div>
    </div>
  </div>

  <main class="c-main">

    <!-- FORM -->
    <section class="c-form-wrap">
      <form id="commentForm" class="c-form" novalidate>

        <div class="c-form-row">
          <div class="c-field">
            <label for="name">نام</label>
            <input type="text" id="name" placeholder="مثلاً: علی رضایی" autocomplete="name">
          </div>
          <div class="c-field">
            <label for="contact">ایمیل یا شماره تلفن</label>
            <input type="text" id="contact" placeholder="ایمیل یا موبایل" autocomplete="email">
          </div>
        </div>

        <div class="c-field">
          <label>امتیاز شما</label>
          <div class="c-stars">
            <input type="radio" name="rating" id="s5" value="5"><label for="s5">★</label>
            <input type="radio" name="rating" id="s4" value="4"><label for="s4">★</label>
            <input type="radio" name="rating" id="s3" value="3"><label for="s3">★</label>
            <input type="radio" name="rating" id="s2" value="2"><label for="s2">★</label>
            <input type="radio" name="rating" id="s1" value="1"><label for="s1">★</label>
          </div>
        </div>

        <div class="c-field">
          <label for="message">نظر شما</label>
          <textarea id="message" placeholder="تجربه‌ی خود را با دیگران به اشتراک بگذارید..."></textarea>
        </div>

        <div class="c-error" id="formError"></div>

        <button type="submit" class="c-submit" id="submitBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          ارسال نظر
        </button>

        <div class="c-success" id="commentSuccess">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          نظر شما ثبت شد و پس از تأیید نمایش داده می‌شود.
        </div>

      </form>
    </section>

    <!-- COMMENTS SLIDER -->
    <section class="c-comments-section">
      <div class="c-comments-head">
        <h2 class="c-comments-title">آخرین نظرات</h2>
        <span class="c-comments-badge" id="approvedCount">...</span>
      </div>

      <div class="c-skeleton-wrap" id="skeletonWrap">
        <div class="c-skel-card"><div class="skel w60"></div><div class="skel w40 mt8"></div><div class="skel w100 mt16"></div><div class="skel w80 mt8"></div></div>
        <div class="c-skel-card"><div class="skel w60"></div><div class="skel w40 mt8"></div><div class="skel w100 mt16"></div><div class="skel w80 mt8"></div></div>
        <div class="c-skel-card"><div class="skel w60"></div><div class="skel w40 mt8"></div><div class="skel w100 mt16"></div><div class="skel w80 mt8"></div></div>
      </div>

      <div class="c-cards-outer" id="cardsOuter" style="display:none">
        <div class="c-cards" id="approvedComments"></div>
        <div class="c-nav">
          <button class="c-arrow" id="cPrev" aria-label="قبلی">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <div class="c-dots" id="cDots"></div>
          <button class="c-arrow" id="cNext" aria-label="بعدی">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
        </div>
      </div>

      <div class="c-empty" id="emptyState" style="display:none">
        <span>💬</span>
        <p>هنوز نظری ثبت نشده — اولین نفر باشید!</p>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
