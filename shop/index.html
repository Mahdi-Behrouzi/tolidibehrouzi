<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIZI | Ultra Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="pb-6 overflow-x-hidden text-gray-800">

    <!-- Header & Main Content (از سورس ۲ استفاده شده) -->
    <!-- [کدهای هدر، بنر و محصولات سورس ۲ را اینجا قرار دهید] -->

    <!-- فوتر جدید -->
    <footer class="bg-[#1a1a1a] text-white py-12 px-6 mt-10 rounded-t-[3rem]">
        <div class="flex flex-col items-center text-center">
            <span class="zizi-logo text-3xl font-black mb-4">ZIZI</span>
            <div class="grid grid-cols-2 gap-8 text-sm w-full border-t border-gray-800 pt-8">
                <div class="text-right">
                    <h4 class="font-bold mb-3 text-white">دسترسی‌ها</h4>
                    <ul class="text-gray-400 space-y-2 text-xs">
                        <li>قوانین و مقررات</li>
                        <li>پیگیری سفارشات</li>
                    </ul>
                </div>
                <div class="text-right">
                    <h4 class="font-bold mb-3 text-white">ارتباط</h4>
                    <ul class="text-gray-400 space-y-2 text-xs">
                        <li>تماس با پشتیبانی</li>
                        <li>شعب حضوری</li>
                    </ul>
                </div>
            </div>
            <p class="mt-10 text-[10px] text-gray-600">© ۲۰۲۶ کلیه حقوق محفوظ است.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
