<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فروشگاه تولیدی بهروزی</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>فروشگاه تولیدی بهروزی</h1>
    <input type="text" id="search" placeholder="جستجوی محصول..." />
    <select id="category-filter">
      <option value="">همه دسته‌ها</option>
    </select>
  </header>

  <section id="products" class="product-list"></section>

  <section id="cart" class="cart">
    <h2>🛒 سبد خرید</h2>
    <ul id="cart-items"></ul>
    <p id="cart-total">جمع کل: ۰ تومان</p>
  </section>

  <footer>
    <p>© 2025 تولیدی بهروزی</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
