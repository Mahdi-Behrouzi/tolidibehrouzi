<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ورود / ثبت‌نام</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <div class="toggle-buttons">
      <button id="showLogin">ورود</button>
      <button id="showSignup">ثبت‌نام</button>
    </div>

    <form id="loginForm">
      <h2>ورود</h2>
      <input type="text" id="loginUsername" placeholder="نام کاربری" required>
      <input type="password" id="loginPassword" placeholder="رمز عبور" required>
      <button type="submit">ورود</button>
      <p id="loginMessage"></p>
    </form>

    <form id="signupForm" style="display: none;">
      <h2>ثبت‌نام</h2>
      <input type="text" id="signupUsername" placeholder="نام کاربری" required>
      <input type="email" id="signupEmail" placeholder="ایمیل" required>
      <input type="password" id="signupPassword" placeholder="رمز عبور" required>
      <button type="submit">ثبت‌نام</button>
      <p id="signupMessage"></p>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="script.js"></script>
</body>
</html>
