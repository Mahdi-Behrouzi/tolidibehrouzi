<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فروشگاه تولیدی بهروزی</title>
<link rel="stylesheet" href="shop.css">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="header-container">
    <h1>تولیدی بهروزی</h1>
    <nav>
      <a href="../index.html">خانه</a>
      <a href="shop.html" class="active">فروشگاه</a>
    </nav>
  </div>
</header>

<main>
  <section class="filters">
    <label>برند:
      <select onchange="filterProducts(this.value, null)">
        <option value="">همه</option>
        <option value="Behrouzi">Behrouzi</option>
      </select>
    </label>
    <label>دسته‌بندی:
      <select onchange="filterProducts(null, this.value)">
        <option value="">همه</option>
        <option value="کیف دوشی">کیف دوشی</option>
        <option value="کیف دستی">کیف دستی</option>
      </select>
    </label>
  </section>

  <section id="productList" class="product-grid">
    <!-- محصولات اینجا رندر می‌شوند -->
  </section>
</main>

<!-- مودال جزئیات محصول -->
<div id="modal" class="modal hidden"></div>

<script src="shop.js"></script>
</body>
</html>
